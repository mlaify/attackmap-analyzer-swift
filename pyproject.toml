[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "attackmap-analyzer-swift"
version = "0.1.0"
description = "Swift ecosystem analyzer plugin for AttackMap (SwiftPM projects, Package.resolved SBOM; server-side Vapor/Hummingbird and iOS/macOS app surface land in later slices)."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Matthew Davis", email = "mlaify@mlaify.io"},
  {name = "AttackMap Contributors"},
]
maintainers = [
  {name = "Matthew Davis", email = "mlaify@mlaify.io"},
]
keywords = [
  "security",
  "static-analysis",
  "appsec",
  "defensive-security",
  "attackmap",
  "attackmap-plugin",
  "swift",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7.0",
]

[project.optional-dependencies]
core = [
  "attackmap>=0.4.29",
]
dev = [
  "pytest>=8.0.0",
  "build>=1.2.0",
  "attackmap>=0.4.29",
]

[project.urls]
Homepage = "https://github.com/mlaify/attackmap-analyzer-swift"
Repository = "https://github.com/mlaify/attackmap-analyzer-swift"
Issues = "https://github.com/mlaify/attackmap-analyzer-swift/issues"
Changelog = "https://github.com/mlaify/attackmap-analyzer-swift/blob/main/CHANGELOG.md"
"AttackMap core" = "https://github.com/mlaify/AttackMap"

[project.entry-points."attackmap.analyzers"]
swift = "attackmap_analyzer_swift:SwiftAnalyzer"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "attackmap-analyzer-swift"
version = "0.1.0"
description = "Swift ecosystem analyzer plugin for AttackMap: Vapor/Hummingbird routes with route-level auth, the iOS/macOS app attack surface, and a SwiftPM/CocoaPods/Carthage SBOM."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Matthew Davis", email = "mlaify@mlaify.io"},
  {name = "AttackMap Contributors"},
]
maintainers = [
  {name = "Matthew Davis", email = "mlaify@mlaify.io"},
]
keywords = [
  "security",
  "static-analysis",
  "appsec",
  "defensive-security",
  "attackmap",
  "attackmap-plugin",
  "swift",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7.0",
]

[project.optional-dependencies]
core = [
  "attackmap @ git+https://github.com/mlaify/AttackMap.git",
]
dev = [
  "pytest>=8.0.0",
  "build>=1.2.0",
  "attackmap @ git+https://github.com/mlaify/AttackMap.git",
]

[project.urls]
Homepage = "https://github.com/mlaify/attackmap-analyzer-swift"
Repository = "https://github.com/mlaify/attackmap-analyzer-swift"
Issues = "https://github.com/mlaify/attackmap-analyzer-swift/issues"
Changelog = "https://github.com/mlaify/attackmap-analyzer-swift/blob/main/CHANGELOG.md"
"AttackMap core" = "https://github.com/mlaify/AttackMap"

[project.entry-points."attackmap.analyzers"]
swift = "attackmap_analyzer_swift:SwiftAnalyzer"
objc = "attackmap_analyzer_swift:ObjCAnalyzer"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
